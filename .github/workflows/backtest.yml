name: RS90 Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of daily data to download from yfinance"
        required: true
        default: "20"
      max_tickers:
        description: "Optional ticker limit for quick tests. Empty = all tickers"
        required: false
        default: ""
      recent_days:
        description: "Recent trading days to export as RS membership and allow for entries"
        required: true
        default: "4000"
      entries:
        description: "Comma-separated entries"
        required: true
        default: "rsi2_next_open,rsi2_intraday_limit"
      exits:
        description: "Comma-separated exits"
        required: true
        default: "trail_0_5atr,trail_1atr,1_day_low,2_day_low,3_day_low,4_day_low,5_day_low,hold_0d_open,hold_1d_open,hold_2d_open,hold_3d_open,hold_4d_open,hold_5d_open,hold_0d_close,hold_1d_close,hold_2d_close,hold_3d_close,hold_4d_close,hold_5d_close,rsi2_gt_50,rsi2_gt_60,rsi2_gt_70,rsi2_gt_80"
      rs_buckets:
        description: "Comma-separated RS buckets"
        required: true
        default: "0_10,10_20,20_30,30_40,40_50,50_60,60_70,70_80,80_90,90_100"
      position_pct:
        description: "Position notional per trade as equity fraction"
        required: true
        default: "0.01"
      slippage_bps:
        description: "Slippage per side in bps. 1 bp = 0.01%."
        required: true
        default: "1.0"
      atr_period:
        description: "ATR period for trail exits"
        required: true
        default: "14"
      commit_outputs:
        description: "Commit outputs/logs back to repo"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      commit_stock_data:
        description: "Commit data/stock_data.csv. Usually false because file may exceed GitHub limits."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare log folders
        run: |
          mkdir -p logs outputs/backtest
          cat > logs/workflow_inputs.json <<JSON
          {
            "years": "${{ github.event.inputs.years }}",
            "max_tickers": "${{ github.event.inputs.max_tickers }}",
            "recent_days": "${{ github.event.inputs.recent_days }}",
            "entries": "${{ github.event.inputs.entries }}",
            "exits": "${{ github.event.inputs.exits }}",
            "rs_buckets": "${{ github.event.inputs.rs_buckets }}",
            "position_pct": "${{ github.event.inputs.position_pct }}",
            "slippage_bps": "${{ github.event.inputs.slippage_bps }}",
            "atr_period": "${{ github.event.inputs.atr_period }}",
            "commit_outputs": "${{ github.event.inputs.commit_outputs }}",
            "commit_stock_data": "${{ github.event.inputs.commit_stock_data }}"
          }
          JSON

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pip install -r requirements.txt 2>&1 | tee logs/01_install.log
          pip install -e . 2>&1 | tee -a logs/01_install.log

      - name: Build daily OHLCV data
        shell: bash
        run: |
          set -o pipefail
          if [ -z "${{ github.event.inputs.max_tickers }}" ]; then
            echo "max_tickers is empty: downloading full ticker list" | tee logs/02_build_data.log
            python scripts/build_data.py --years "${{ github.event.inputs.years }}" 2>&1 | tee -a logs/02_build_data.log
          else
            echo "max_tickers=${{ github.event.inputs.max_tickers }}: downloading limited ticker list" | tee logs/02_build_data.log
            python scripts/build_data.py --years "${{ github.event.inputs.years }}" --max-tickers "${{ github.event.inputs.max_tickers }}" 2>&1 | tee -a logs/02_build_data.log
          fi

      - name: Save downloaded data summary
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee logs/03_data_summary.log
          import json
          from pathlib import Path
          import pandas as pd
          tickers = pd.read_csv('data/stock_ticker.csv')
          prices = pd.read_csv('data/stock_data.csv')
          summary = {
              'ticker_list_rows': int(len(tickers)),
              'downloaded_price_rows': int(len(prices)),
              'downloaded_unique_tickers': int(prices['ticker'].nunique()),
              'date_min': str(prices['date'].min()),
              'date_max': str(prices['date'].max()),
          }
          print(json.dumps(summary, indent=2))
          Path('outputs/backtest').mkdir(parents=True, exist_ok=True)
          Path('outputs/backtest/data_summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          PY

      - name: Run selected RSI2 strategy matrix
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_backtest.py \
            --matrix \
            --position-pct "${{ github.event.inputs.position_pct }}" \
            --recent-days "${{ github.event.inputs.recent_days }}" \
            --atr-period "${{ github.event.inputs.atr_period }}" \
            --entries "${{ github.event.inputs.entries }}" \
            --exits "${{ github.event.inputs.exits }}" \
            --rs-buckets "${{ github.event.inputs.rs_buckets }}" \
            --slippage-bps "${{ github.event.inputs.slippage_bps }}" \
            --output-dir outputs/backtest 2>&1 | tee logs/04_run_backtest.log

      - name: Save RS bucket and report summary
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee logs/05_output_summary.log
          import json
          from pathlib import Path
          import pandas as pd
          out = Path('outputs/backtest')
          report_md = out / 'REPORT.md'
          lines = ['# RS90 Backtest Report', '']
          lines.append('## Matrix')
          lines.append('')
          lines.append('Entries: ${{ github.event.inputs.entries }}')
          lines.append('')
          lines.append('Exits: ${{ github.event.inputs.exits }}')
          lines.append('')
          lines.append('RS buckets: ${{ github.event.inputs.rs_buckets }}')
          lines.append('')
          lines.append('Slippage bps: ${{ github.event.inputs.slippage_bps }}')
          lines.append('')
          if (out / 'data_summary.json').exists():
              lines.append('## Data summary')
              data_summary = json.loads((out / 'data_summary.json').read_text(encoding='utf-8'))
              for k, v in data_summary.items():
                  lines.append(f'- {k}: {v}')
              lines.append('')
          if (out / 'strategy_summary.csv').exists():
              summary = pd.read_csv(out / 'strategy_summary.csv')
              print('strategy_summary=')
              print(summary.to_string(index=False))
              lines.append('## Strategy summary')
              lines.append(summary.to_markdown(index=False))
              lines.append('')
          else:
              print('No strategy_summary.csv found')
              lines.append('## Strategy summary')
              lines.append('(No strategy_summary.csv found)')
              lines.append('')
          lines.append('## Output files')
          for p in sorted(out.rglob('*')):
              if p.is_file():
                  lines.append(f'- `{p.as_posix()}`')
          report_md.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Wrote {report_md}')
          PY

      - name: Upload outputs and logs
        uses: actions/upload-artifact@v4
        with:
          name: rs90-backtest-outputs
          path: |
            outputs/backtest/
            logs/
            data/stock_data.csv

      - name: Commit reports and logs
        if: ${{ github.event.inputs.commit_outputs == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/backtest logs
          if [ "${{ github.event.inputs.commit_stock_data }}" = "true" ]; then
            git add data/stock_data.csv
          fi
          if git diff --cached --quiet; then
            echo "No report/log changes to commit."
          else
            git commit -m "Update RSI2 backtest reports and logs"
            git push
          fi
