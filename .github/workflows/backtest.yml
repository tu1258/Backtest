name: RS Bucket RSI2 Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of daily data to download"
        required: true
        default: "20"
      max_tickers:
        description: "Limit tickers for testing. Leave blank for all."
        required: false
        default: ""
      recent_days:
        description: "Number of recent trading days allowed for entries"
        required: true
        default: "4000"
      entries:
        description: "Comma-separated: rsi2_next_open,rsi2_intraday_limit"
        required: true
        default: "rsi2_next_open"
      exits:
        description: "Comma-separated exits"
        required: true
        default: "hold_1d_open,hold_2d_open,hold_3d_open,hold_4d_open,hold_5d_open,rsi2_gt_50,rsi2_gt_60,rsi2_gt_70,rsi2_gt_80"
      rs_buckets:
        description: "Comma-separated RS buckets, e.g. 90_100 or 0_10,10_20,...,90_100"
        required: true
        default: "90_100"
      position_pct:
        description: "Position notional per trade as equity fraction"
        required: true
        default: "0.01"
      slippage_bps:
        description: "Slippage per side in bps. 1 bp = 0.01%."
        required: true
        default: "1.0"
      commit_outputs:
        description: "Commit outputs/logs back to repo"
        required: true
        default: "true"
      commit_stock_data:
        description: "Commit data/stock_data.csv. Usually false because file may exceed GitHub limits."
        required: true
        default: "false"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          mkdir -p logs
          python -m pip install --upgrade pip 2>&1 | tee logs/01_install.log
          pip install -r requirements.txt 2>&1 | tee -a logs/01_install.log

      - name: Build daily OHLCV data
        run: |
          set -o pipefail
          if [ -z "${{ github.event.inputs.max_tickers }}" ]; then
            python scripts/build_data.py --years "${{ github.event.inputs.years }}" 2>&1 | tee logs/02_build_data.log
          else
            python scripts/build_data.py --years "${{ github.event.inputs.years }}" --max-tickers "${{ github.event.inputs.max_tickers }}" 2>&1 | tee logs/02_build_data.log
          fi

      - name: Run RSI2 strategy matrix
        run: |
          set -o pipefail
          python scripts/run_backtest.py \
            --price-csv data/stock_data.csv \
            --output-dir outputs/backtest \
            --recent-days "${{ github.event.inputs.recent_days }}" \
            --entries "${{ github.event.inputs.entries }}" \
            --exits "${{ github.event.inputs.exits }}" \
            --rs-buckets "${{ github.event.inputs.rs_buckets }}" \
            --position-pct "${{ github.event.inputs.position_pct }}" \
            --slippage-bps "${{ github.event.inputs.slippage_bps }}" \
            2>&1 | tee logs/04_run_backtest.log

      - name: Save workflow inputs and report
        if: always()
        run: |
          mkdir -p logs outputs/backtest
          cat > logs/workflow_inputs.json <<EOF
          {
            "years": "${{ github.event.inputs.years }}",
            "max_tickers": "${{ github.event.inputs.max_tickers }}",
            "recent_days": "${{ github.event.inputs.recent_days }}",
            "entries": "${{ github.event.inputs.entries }}",
            "exits": "${{ github.event.inputs.exits }}",
            "rs_buckets": "${{ github.event.inputs.rs_buckets }}",
            "position_pct": "${{ github.event.inputs.position_pct }}",
            "slippage_bps": "${{ github.event.inputs.slippage_bps }}"
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          out = Path('outputs/backtest')
          report = out / 'REPORT.md'
          lines = ['# Backtest Report', '']
          lines.append('## Workflow inputs')
          lines.append(Path('logs/workflow_inputs.json').read_text())
          summary = out / 'strategy_summary.csv'
          if summary.exists():
              df = pd.read_csv(summary)
              lines.append('\n## Strategy Summary')
              lines.append(df.to_markdown(index=False))
          membership = out / 'rs_membership_recent.csv'
          if membership.exists():
              m = pd.read_csv(membership)
              lines.append('\n## RS Membership Counts')
              if not m.empty:
                  lines.append(m.groupby('rs_bucket').size().to_frame('rows').to_markdown())
          report.write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs-backtest-outputs
          path: |
            outputs/backtest
            logs
            data/stock_data.csv

      - name: Commit outputs and logs
        if: always() && github.event.inputs.commit_outputs == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/backtest logs
          if [ "${{ github.event.inputs.commit_stock_data }}" = "true" ]; then
            git add data/stock_data.csv
          fi
          git diff --cached --quiet || git commit -m "Update RSI2 backtest outputs"
          git push || true
