name: RS90 Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of daily data to download from yfinance"
        required: true
        default: "2"
      max_tickers:
        description: "Optional ticker limit for quick tests. Empty = all tickers"
        required: false
        default: ""
      recent_days:
        description: "Recent trading days to export as RS90 membership and allow for entries"
        required: true
        default: "5"
      position_pct:
        description: "Fixed notional position size as fraction of equity"
        required: true
        default: "0.01"
      atr_period:
        description: "ATR period for trail exits. Matrix runs 0.5 ATR and 1.0 ATR."
        required: true
        default: "14"
      commit_outputs:
        description: "Commit outputs/backtest and logs back to repo"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      commit_stock_data:
        description: "Commit data/stock_data.csv too. Not recommended for full universe because GitHub has a 100MB file limit."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare log folders
        run: |
          mkdir -p logs outputs/backtest
          cat > logs/workflow_inputs.json <<EOF
          {
            "years": "${{ github.event.inputs.years }}",
            "max_tickers": "${{ github.event.inputs.max_tickers }}",
            "recent_days": "${{ github.event.inputs.recent_days }}",
            "position_pct": "${{ github.event.inputs.position_pct }}",
            "atr_period": "${{ github.event.inputs.atr_period }}",
            "matrix": "15 combos: breakout_1_1, breakout_2_2, rsi2 x trail_0_5atr, trail_1atr, ma10, 5_day_low, prev_day_low",
            "commit_outputs": "${{ github.event.inputs.commit_outputs }}",
            "commit_stock_data": "${{ github.event.inputs.commit_stock_data }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "sha": "${{ github.sha }}"
          }
          EOF
          cat logs/workflow_inputs.json

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee logs/01_install.log
          pip install -r requirements.txt 2>&1 | tee -a logs/01_install.log
          pip install -e . 2>&1 | tee -a logs/01_install.log

      - name: Build daily OHLCV data
        shell: bash
        run: |
          set -o pipefail
          if [ -z "${{ github.event.inputs.max_tickers }}" ]; then
            echo "max_tickers is empty: downloading full ticker list" | tee logs/02_build_data.log
            python scripts/build_data.py --years "${{ github.event.inputs.years }}" 2>&1 | tee -a logs/02_build_data.log
          else
            echo "max_tickers=${{ github.event.inputs.max_tickers }}: downloading limited ticker list" | tee logs/02_build_data.log
            python scripts/build_data.py --years "${{ github.event.inputs.years }}" --max-tickers "${{ github.event.inputs.max_tickers }}" 2>&1 | tee -a logs/02_build_data.log
          fi

      - name: Save downloaded data summary
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee logs/03_data_summary.log
          import json
          import pandas as pd
          from pathlib import Path
          tickers = pd.read_csv('data/stock_ticker.csv')
          prices = pd.read_csv('data/stock_data.csv')
          summary = {
              'ticker_list_rows': int(len(tickers)),
              'downloaded_price_rows': int(len(prices)),
              'downloaded_unique_tickers': int(prices['ticker'].nunique()),
              'date_min': str(prices['date'].min()),
              'date_max': str(prices['date'].max()),
          }
          print(json.dumps(summary, indent=2))
          Path('outputs/backtest').mkdir(parents=True, exist_ok=True)
          Path('outputs/backtest/data_summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          PY

      - name: Run 15 strategy matrix
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_backtest.py \
            --matrix \
            --position-pct "${{ github.event.inputs.position_pct }}" \
            --recent-days "${{ github.event.inputs.recent_days }}" \
            --atr-period "${{ github.event.inputs.atr_period }}" \
            --output-dir outputs/backtest 2>&1 | tee logs/04_run_backtest.log

      - name: Save RS90 and report summary
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee logs/05_output_summary.log
          import json
          from pathlib import Path
          import pandas as pd

          out = Path('outputs/backtest')
          rs = pd.read_csv(out / 'rs90_daily_recent.csv')
          rs_counts = rs.groupby('date')['ticker'].nunique().to_dict() if not rs.empty else {}
          print('rs90_rows=', len(rs))
          print('rs90_dates=', sorted(rs['date'].unique().tolist()) if not rs.empty else [])
          print('rs90_count_by_date=')
          print(rs.groupby('date')['ticker'].nunique().to_string() if not rs.empty else '(empty)')

          summary_path = out / 'strategy_summary.csv'
          if summary_path.exists():
              summary = pd.read_csv(summary_path)
              print('\nstrategy_summary=')
              print(summary.to_string(index=False))
          else:
              summary = pd.DataFrame()

          report_md = out / 'REPORT.md'
          lines = []
          lines.append('# RS90 Backtest Report')
          lines.append('')
          lines.append('## Matrix')
          lines.append('')
          lines.append('Entries: breakout_1_1, breakout_2_2, rsi2')
          lines.append('')
          lines.append('Exits: trail_0_5atr, trail_1atr, ma10, 5_day_low, prev_day_low')
          lines.append('')
          lines.append('## Data summary')
          data_summary = json.loads((out / 'data_summary.json').read_text(encoding='utf-8')) if (out / 'data_summary.json').exists() else {}
          for k, v in data_summary.items():
              lines.append(f'- {k}: {v}')
          lines.append('')
          lines.append('## Recent RS90 counts')
          for d, n in rs_counts.items():
              lines.append(f'- {d}: {n}')
          lines.append('')
          lines.append('## Strategy summary')
          if not summary.empty:
              lines.append(summary.to_markdown(index=False))
          else:
              lines.append('(No strategy_summary.csv found)')
          lines.append('')
          lines.append('## Output files')
          for p in sorted(out.rglob('*')):
              if p.is_file():
                  lines.append(f'- `{p.as_posix()}`')
          report_md.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Wrote {report_md}')
          PY

      - name: Upload outputs and logs
        uses: actions/upload-artifact@v4
        with:
          name: rs90-backtest-outputs
          path: |
            outputs/backtest/
            logs/
            data/stock_data.csv

      - name: Commit reports and logs
        if: ${{ github.event.inputs.commit_outputs == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/backtest logs
          if [ "${{ github.event.inputs.commit_stock_data }}" = "true" ]; then
            git add data/stock_data.csv
          fi
          if git diff --cached --quiet; then
            echo "No report/log changes to commit."
          else
            git commit -m "Update 15-combo backtest reports and logs"
            git push
          fi
