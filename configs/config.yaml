# RS90 backtester default config

data:
  ticker_csv: data/stock_ticker.csv
  price_csv: data/stock_data.csv
  benchmark: ^GSPC
  years: 2
  auto_adjust: true
  batch_size: 80
  sleep_seconds: 1
  max_tickers: null

backtest:
  initial_capital: 1000000
  position_pct: 0.01
  rs_threshold: 90
  recent_days: 5
  exit_mode: ma10
  # Single-run defaults. Matrix mode ignores these pivot values and runs breakout_1_1 plus breakout_2_2.
  pivot_left: 1
  pivot_right: 1
  atr_period: 14
  # Single-run defaults. Matrix mode runs ATR multiples 0.5 and 1.0.
  atr_multiple: 1.0
  # Single-run default. Matrix mode runs 5-day low.
  n_day_low_period: 5
  max_open_positions: 100
  max_new_positions_per_day: 100
  allow_same_ticker_overlap: false
  start_date: null
  end_date: null
  strategies:
    - breakout
    - rsi2

costs:
  slippage_bps: 0
  commission_per_trade: 0

risk:
  max_stop_pct: null

# Matrix selection. GitHub Actions inputs can override these.
matrix:
  entries:
    - breakout_1_1
    - breakout_2_2
    - rsi2
  exits:
    - trail_0_5atr
    - trail_1atr
    - ma10
    - 5_day_low
    - prev_day_low
