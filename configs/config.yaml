# RS90 backtester default config

data:
  ticker_csv: data/stock_ticker.csv
  price_csv: data/stock_data.csv
  benchmark: ^GSPC
  years: 2
  auto_adjust: true
  batch_size: 80
  sleep_seconds: 1
  max_tickers: null   # set an integer for quick tests

backtest:
  initial_capital: 1000000
  position_pct: 0.01       # fixed notional position size = equity * 1%
  rs_threshold: 90
  recent_days: 7
  exit_mode: either        # ma10, pivot_low, either
  max_open_positions: 100
  max_new_positions_per_day: 100
  allow_same_ticker_overlap: false
  start_date: null
  end_date: null
  strategies:
    - breakout
    - rsi2

costs:
  slippage_bps: 0
  commission_per_trade: 0

risk:
  # Current user rule: stop = previous day's low.
  # Optional risk filter: skip entries if stop distance is greater than max_stop_pct.
  # Set to null to disable.
  max_stop_pct: null
